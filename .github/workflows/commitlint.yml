---
# Every commit in a pull request, and its title, follow Conventional Commits,
# checked by the script behind the check-commit-message action paragon-stats
# uses, fetched at the same pinned commit as the other shared actions. A type
# that cuts a release must change something under skills/, the plugin's
# product: a feat or fix touching only docs or CI would otherwise publish a
# release with nothing in it.
name: commitlint

"on":
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SHARED: https://raw.githubusercontent.com/paragon-stats/github-actions/8e164c6001e7a28bf2b06e6c528f97cda9af37cb  # v2.2.1

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # the whole pull request's commit range
      - name: Fetch the shared checker and commit types
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' "$SHARED/check-commit-message/check-commit-message.sh" -o "$RUNNER_TEMP/check-commit-message.sh"
          curl -fsSL --proto '=https' "$SHARED/commit-types.txt" -o "$RUNNER_TEMP/commit-types.txt"
      # pyproject.toml restates the bump mapping for the release tooling; the
      # shared commit-types.txt is the source of truth, and drift fails here.
      - name: Verify the release bump mapping matches the shared commit types
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/commit-types.txt" <<'PY'
          import sys, tomllib

          types = {}
          for line in open(sys.argv[1]):
              cols = line.split("#")[0].split()
              if cols:
                  types[cols[0]] = cols[1]

          opts = tomllib.load(open("pyproject.toml", "rb"))["tool"]["semantic_release"]["commit_parser_options"]
          checks = {
              "allowed_tags": sorted(types),
              "minor_tags": sorted(t for t, b in types.items() if b == "minor"),
              "patch_tags": sorted(t for t, b in types.items() if b == "patch"),
          }
          rc = 0
          for key, want in checks.items():
              got = sorted(opts[key])
              if got != want:
                  print(f"::error::pyproject {key} drifted: {got} != commit-types.txt {want}")
                  rc = 1
          sys.exit(rc)
          PY
      - name: Validate each commit and the pull request title
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          TYPES_FILE: ${{ runner.temp }}/commit-types.txt
          PRODUCT_PATH: skills/
        run: |
          set -uo pipefail
          check="$RUNNER_TEMP/check-commit-message.sh"
          fail=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg.txt"
            if ! MESSAGE_FILE="$RUNNER_TEMP/msg.txt" \
                 CHANGED_PATHS="$(git diff-tree --no-commit-id --name-only -r "$sha")" \
                 bash "$check"; then
              echo "::error::bad commit: $(git log -1 --format='%h %s' "$sha")"
              fail=1
            fi
          done
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title.txt"
          if ! MESSAGE_FILE="$RUNNER_TEMP/title.txt" \
               CHANGED_PATHS="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")" \
               bash "$check"; then
            echo "::error::bad pull request title: $PR_TITLE"
            fail=1
          fi
          exit "$fail"
...
